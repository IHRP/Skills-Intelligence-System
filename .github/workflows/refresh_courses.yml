name: Refresh SWDA courses

on:
  schedule:
    - cron: '0 18 1 * *'          # 02:00 SGT on the 1st of each month
  workflow_dispatch:
    inputs:
      keyword:
        description: 'Search keyword'
        default: 'HR'
      pages:
        description: 'Pages to scrape (0 = all)'
        default: '1'
      skip_load:
        description: 'Scrape only, do not write to Supabase'
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Scrape SWDA
        run: |
          python scripts/scrape_swda.py \
            --keyword "${{ inputs.keyword || 'HR' }}" \
            --pages ${{ inputs.pages || 1 }} \
            --out data

      - name: Load into Supabase
        if: ${{ inputs.skip_load != true }}
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/load_courses.py data/skillsfuture_hr.xlsx

      - name: Upload output and debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swda-${{ github.run_number }}
          path: |
            data/*.xlsx
            data/debug_*.png
            data/debug_*.html
          retention-days: 14
          if-no-files-found: warn
