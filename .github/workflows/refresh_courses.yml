# .github/workflows/refresh_courses.yml
name: Refresh SWDA courses

on:
  schedule:
    - cron: '0 18 1 * *'      # 02:00 SGT on the 1st
  workflow_dispatch:
    inputs:
      keyword:
        description: 'Search keyword'
        default: 'HR'
      pages:
        description: 'Pages to scrape (0 = all)'
        default: '0'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120        # detail scraping is slow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Scrape SWDA
        run: |
          python scripts/scrape_swda.py \
            --keyword "${{ inputs.keyword || 'HR' }}" \
            --pages ${{ inputs.pages || 0 }} \
            --out data

      - name: Load into Supabase
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/load_courses.py data/skillsfuture_hr.xlsx

      - name: Keep the scraped file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swda-${{ github.run_number }}
          path: data/*.xlsx
          retention-days: 90
